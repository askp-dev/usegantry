# `uses: askp-dev/usegantry@v1`: scan + SARIF + badge/report artifact. No commit-back, no contents: write.
# Certificates from this action are self-signed (a composite action can't prove which steps ran);
# use the reusable workflow askp-dev/usegantry/.github/workflows/scan.yml@v1 for a Verified certificate.
name: Gantry
description: Launch-readiness scan for AI-generated repos (security, privacy, legal, cost).
author: usegantry
branding: { icon: shield, color: green }
inputs:
  path: { description: "Directory to scan, relative to the repo root.", default: "." }
  profile: { description: "Comma-separated compliance profiles.", default: "" }
  strict: { description: "Fail when LAUNCH_BLOCKED.", default: "false" }
  upload-sarif: { description: "Upload SARIF to code scanning (needs security-events: write).", default: "true" }
outputs:
  score: { description: "0-100", value: "${{ steps.gate.outputs.score }}" }
  status: { description: "LAUNCH_READY | NEEDS_REVIEW | LAUNCH_BLOCKED", value: "${{ steps.gate.outputs.status }}" }
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with: { bun-version: 1.2.10 }
    - name: Validate inputs
      shell: bash
      env: { TARGET: "${{ inputs.path }}", PROFILE: "${{ inputs.profile }}" }
      run: |
        case "$TARGET" in /*|*..*) echo "::error::path must be relative and inside the repo"; exit 2 ;; esac
        printf '%s' "$PROFILE" | grep -Eq '^[a-z,-]*$' || { echo "::error::invalid profile"; exit 2; }
    - name: Scan
      shell: bash
      env: { TARGET: "${{ inputs.path }}", PROFILE: "${{ inputs.profile }}", GANTRY_VERSION: "0.1.0" }
      run: |
        bun add -g "@usegantry/cli@${GANTRY_VERSION}"
        set -- ; [ -n "$PROFILE" ] && set -- --profile "$PROFILE"
        gantry scan "$TARGET" --json "$@" > gantry-report.json || true
        gantry scan "$TARGET" --sarif "$@" > gantry.sarif || true
        gantry check "$TARGET" --md > gantry-check.md || true
        cat gantry-check.md >> "$GITHUB_STEP_SUMMARY"
        gantry badge "$TARGET"
    - uses: github/codeql-action/upload-sarif@v3
      if: always() && inputs.upload-sarif == 'true' && hashFiles('gantry.sarif') != ''
      with: { sarif_file: gantry.sarif, category: gantry }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gantry
        path: |
          gantry-report.json
          gantry.sarif
          gantry-check.md
          ${{ inputs.path }}/.gantry/badge.svg
        if-no-files-found: warn
    - name: Gate
      id: gate
      shell: bash
      env: { STRICT: "${{ inputs.strict }}" }
      run: |
        status=$(bun -e 'const r=JSON.parse(require("fs").readFileSync("gantry-report.json","utf8"));console.log(r.status)')
        score=$(bun -e 'const r=JSON.parse(require("fs").readFileSync("gantry-report.json","utf8"));console.log(r.score)')
        echo "status=$status" >> "$GITHUB_OUTPUT"; echo "score=$score" >> "$GITHUB_OUTPUT"
        if [ "$STRICT" = "true" ] && [ "$status" = "LAUNCH_BLOCKED" ]; then echo "::error::LAUNCH_BLOCKED (strict)"; exit 1; fi
