# Inactive template. To deploy this candidate to GitHub Pages, copy it to .github/workflows/deploy-pages.yml.
name: deploy-pages
on:
  push:
    branches: [main]
    paths: ["site-claude/**", "packages/core/src/**", "fixtures/**", "install.sh"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.10 }
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site-claude
      - run: bun run build
        working-directory: site-claude
      - uses: actions/upload-pages-artifact@v3
        with: { path: site-claude/build }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
