[package]
name = "jobs-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
async-openai = "0.24"
shared = { path = "../shared" }

[dev-dependencies]
reqwest = "0.12"
